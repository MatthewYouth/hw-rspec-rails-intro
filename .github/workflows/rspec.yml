name: RSpec
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: production
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.8'
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bundle exec rspec
